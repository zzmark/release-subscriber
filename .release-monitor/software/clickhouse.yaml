schema_version: 1

software:
  slug: clickhouse
  display_name: ClickHouse
  status: planned
  output_directory: clickhouse

source:
  type: versioned_markdown_page
  changelog_url_template: https://clickhouse.com/docs/resources/changelogs/oss/{year}.md
  documentation_url: https://clickhouse.com/docs/
  repository_url: https://github.com/ClickHouse/ClickHouse
  presentation:
    type: html_slides
    public_url_template: https://presentations.clickhouse.com/{year}-release-{version}/
    source_repository: ClickHouse/ClickHouse-presentations
    source_branch: master
    source_directory_template: "{year}-release-{version}"
    entry_file: index.html

selection:
  minimum_version: "22.3"
  minimum_inclusive: true
  version_format: YY.M
  version_pattern: '^\d{2}\.(?:[1-9]|1[0-2])$'
  year_mapping: "2000 + YY"
  include_prereleases: false
  release_months: 1-12

processing:
  release_unit: monthly_version_section
  changelog_mode: extract_version_section_from_year_page
  source_year_from_version: true
  preserve_original_section_text: true
  published_date_source_order:
    - changelog_version_section
    - presentation_metadata
  do_not_guess_missing_dates: true

lts:
  months:
    - 3
    - 8
  release_card_label: LTS
  determine_from: version_month

presentation:
  required_for_each_version: true
  source_format: repository_html_slides
  source_of_truth: ClickHouse/ClickHouse-presentations
  translated_format: static_html_slides
  output_directory: presentation.zh
  entry_file: index.html
  hosting: github_pages
  preserve:
    - slide_order
    - layout
    - images
    - code
    - links
    - speaker_attribution
  translate:
    - visible_titles
    - visible_body_text
    - captions
    - labels
    - speaker_notes_when_present
  do_not_translate:
    - code
    - commands
    - identifiers
    - URLs
    - product_names
  release_card_links:
    original: presentation_url
    translated: ./presentation.zh/
  failure_policy: do_not_publish_incomplete_version

summary:
  focus: ClickHouse OSS monthly release
  use_changelog_and_presentation: true
  prioritize:
    - breaking_changes
    - major_features
    - performance
    - bugfixes_and_security

history:
  initial_backfill_status: pending
  existing_versions_are_immutable: true
  metadata_verification_status: completed

theme:
  strategy: version_month_season
  season_source: version_month
  seasons:
    spring:
      months: [3, 4, 5]
      accent: "#5B8C3A"
    summer:
      months: [6, 7, 8]
      accent: "#168AAD"
    autumn:
      months: [9, 10, 11]
      accent: "#C96A24"
    winter:
      months: [12, 1, 2]
      accent: "#5865A8"

notes:
  - 版本号只保留 YY.M 月度版本，不使用完整补丁版本号作为目录名。
  - 每年从对应四位数年份的 Changelog 页面抽取各月版本段落。
  - 3 月和 8 月版本为 LTS，必须在 Release Card 中明确标记。
  - 演示源码从 ClickHouse/ClickHouse-presentations 的对应版本目录读取，不从线上渲染页反向抓取。
  - 中文演示是保留原演示视觉结构的静态 HTML 幻灯片，不生成摘要式文档替代品。
  - Release Card 必须同时提供原始演示与中文演示链接。
